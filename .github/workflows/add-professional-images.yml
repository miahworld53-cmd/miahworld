name: Add professional travel images

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  update-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add professional travel gallery
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '      {/* PROFESSIONAL TRAVEL GALLERY */}'

          if marker not in text:
              gallery = r'''      {/* PROFESSIONAL TRAVEL GALLERY */}
      <section className="bg-white px-6 py-20">
        <div className="mx-auto max-w-7xl">
          <div className="text-center">
            <p className="font-bold uppercase tracking-widest text-blue-600">Travel Inspiration</p>
            <h2 className="mt-3 text-4xl font-extrabold text-slate-900 md:text-5xl">See Malaysia. Feel the Journey.</h2>
            <p className="mx-auto mt-4 max-w-2xl text-lg text-slate-600">Beautiful destinations, unforgettable experiences and professionally arranged private tours with MIAH WORLD.</p>
          </div>

          <div className="mt-12 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
            <div className="group overflow-hidden rounded-3xl bg-slate-100 shadow-lg">
              <div className="relative h-72 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1508062878650-88b52897f298?auto=format&fit=crop&w=1200&q=85" alt="Kuala Lumpur skyline and Petronas Twin Towers" className="h-full w-full object-cover transition duration-500 group-hover:scale-105" />
                <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-6 pt-16 text-white"><h3 className="text-2xl font-extrabold">Kuala Lumpur</h3><p className="mt-1 text-sm">City lights • KLCC • Petronas Twin Towers</p></div>
              </div>
            </div>

            <div className="group overflow-hidden rounded-3xl bg-slate-100 shadow-lg">
              <div className="relative h-72 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1200&q=85" alt="Cameron Highlands tea plantation" className="h-full w-full object-cover transition duration-500 group-hover:scale-105" />
                <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-6 pt-16 text-white"><h3 className="text-2xl font-extrabold">Cameron Highlands</h3><p className="mt-1 text-sm">Tea plantations • Cool mountain air</p></div>
              </div>
            </div>

            <div className="group overflow-hidden rounded-3xl bg-slate-100 shadow-lg">
              <div className="relative h-72 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=1200&q=85" alt="Langkawi tropical beach" className="h-full w-full object-cover transition duration-500 group-hover:scale-105" />
                <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-6 pt-16 text-white"><h3 className="text-2xl font-extrabold">Langkawi</h3><p className="mt-1 text-sm">Island life • Beaches • Cable Car</p></div>
              </div>
            </div>

            <div className="group overflow-hidden rounded-3xl bg-slate-100 shadow-lg">
              <div className="relative h-72 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1596422846543-75c6fc197f07?auto=format&fit=crop&w=1200&q=85" alt="Genting Highlands Malaysia" className="h-full w-full object-cover transition duration-500 group-hover:scale-105" />
                <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-6 pt-16 text-white"><h3 className="text-2xl font-extrabold">Genting Highlands</h3><p className="mt-1 text-sm">Mountains • Cable Car • Family Fun</p></div>
              </div>
            </div>

            <div className="group overflow-hidden rounded-3xl bg-slate-100 shadow-lg">
              <div className="relative h-72 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1608998054797-9d5b1a4f7a17?auto=format&fit=crop&w=1200&q=85" alt="Malacca heritage architecture" className="h-full w-full object-cover transition duration-500 group-hover:scale-105" />
                <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-6 pt-16 text-white"><h3 className="text-2xl font-extrabold">Malacca</h3><p className="mt-1 text-sm">Heritage • Jonker Street • History</p></div>
              </div>
            </div>

            <div className="group overflow-hidden rounded-3xl bg-slate-100 shadow-lg">
              <div className="relative h-72 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1583417319070-4a69db38a482?auto=format&fit=crop&w=1200&q=85" alt="Putrajaya Malaysia landmark" className="h-full w-full object-cover transition duration-500 group-hover:scale-105" />
                <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent p-6 pt-16 text-white"><h3 className="text-2xl font-extrabold">Putrajaya</h3><p className="mt-1 text-sm">Pink Mosque • Lake • Architecture</p></div>
              </div>
            </div>
          </div>
        </div>
      </section>

'''
              marker_after = '      {/* SERVICES */}'
              if marker_after not in text:
                  raise SystemExit('Services marker not found')
              text = text.replace(marker_after, gallery + marker_after, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit website update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add professional travel destination gallery"
          git push
