name: Add Transport Services Section

on:
  push:
    paths:
      - '.github/workflows/add-transport-services.yml'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add transport services section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          marker = 'Transport & Airport Services'
          if marker in text:
              print('Transport section already exists; nothing to do.')
              raise SystemExit(0)

          section = r'''

      <section id="transport" className="bg-slate-50 px-6 py-20">
        <div className="mx-auto max-w-7xl">
          <div className="text-center">
            <p className="font-bold uppercase tracking-widest text-blue-600">TRANSPORT SERVICES</p>
            <h2 className="mt-2 text-4xl font-extrabold">Transport & Airport Services</h2>
            <p className="mx-auto mt-4 max-w-2xl text-lg text-slate-600">Reliable transport solutions for airport transfers, private travel and car rental across Kuala Lumpur and Malaysia.</p>
          </div>

          <div className="mt-10 grid gap-6 md:grid-cols-3">
            <div className="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl">
              <img src="https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=1000&q=80" alt="Transport service" className="h-52 w-full object-cover" />
              <div className="p-7">
                <div className="text-4xl">🚐</div>
                <h3 className="mt-4 text-2xl font-extrabold">Transport Service</h3>
                <p className="mt-3 leading-7 text-slate-600">Private cars, MPVs and vans for families, groups, business trips and sightseeing throughout Malaysia.</p>
                <a href={`https://wa.me/${WA}?text=${encodeURIComponent('Assalamu Alaikum, I would like to enquire about your Transport Service.')}`} target="_blank" rel="noreferrer" className="mt-5 inline-block rounded-full bg-blue-600 px-6 py-3 font-bold text-white hover:bg-blue-700">Enquire Now →</a>
              </div>
            </div>

            <div className="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl">
              <img src="https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1000&q=80" alt="Airport pickup and drop off" className="h-52 w-full object-cover" />
              <div className="p-7">
                <div className="text-4xl">✈️</div>
                <h3 className="mt-4 text-2xl font-extrabold">Airport Pickup & Drop-off</h3>
                <p className="mt-3 leading-7 text-slate-600">KLIA and KLIA2 airport transfers to and from your hotel, home or any destination with convenient private transport.</p>
                <a href={`https://wa.me/${WA}?text=${encodeURIComponent('Assalamu Alaikum, I need a quotation for airport pickup or drop-off.')}`} target="_blank" rel="noreferrer" className="mt-5 inline-block rounded-full bg-blue-600 px-6 py-3 font-bold text-white hover:bg-blue-700">Get Airport Transfer →</a>
              </div>
            </div>

            <div className="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl">
              <img src="https://images.unsplash.com/photo-1502877338535-766e1452684a?auto=format&fit=crop&w=1000&q=80" alt="Car rental service" className="h-52 w-full object-cover" />
              <div className="p-7">
                <div className="text-4xl">🚗</div>
                <h3 className="mt-4 text-2xl font-extrabold">Car Rental</h3>
                <p className="mt-3 leading-7 text-slate-600">Flexible car rental options for short trips, holidays, business travel and longer stays. Ask us about available vehicles.</p>
                <a href={`https://wa.me/${WA}?text=${encodeURIComponent('Assalamu Alaikum, I would like to enquire about Car Rental.')}`} target="_blank" rel="noreferrer" className="mt-5 inline-block rounded-full bg-blue-600 px-6 py-3 font-bold text-white hover:bg-blue-700">Enquire for Car Rental →</a>
              </div>
            </div>
          </div>
        </div>
      </section>
'''

          closing = '    </main>'
          if closing not in text:
              raise SystemExit('Could not find main closing tag in app/page.tsx')

          text = text.replace(closing, section + '\n' + closing, 1)
          path.write_text(text, encoding='utf-8')
          print('Transport section added.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add transport airport transfer and car rental services"
            git push
          fi
