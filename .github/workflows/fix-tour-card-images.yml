name: Fix Penang and Terengganu tour images

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update tour cards
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          old_penang = 'https://images.unsplash.com/photo-1513415564515-763d91423bdd?auto=format&fit=crop&w=1000&q=80'
          new_penang = 'https://storage.googleapis.com/accesstravel-media/attractions/13003/photos/13003_5230946.jpg'
          text = text.replace(old_penang, new_penang)

          pattern = r'\["City Tour",\s*"Putrajaya",\s*"[^"]*",\s*"Half Day / Full Day",\s*"[^"]*"\]'
          replacement = '["Island Tour", "Terengganu – Perhentian Beach", "Perhentian Beach, island escape, beautiful beaches, nature and scenic views. Private, family and group tour options available.", "Full Day / 2 Days 1 Night", "/terengganu-tour-live.svg"]'
          text, count = re.subn(pattern, replacement, text, count=1)
          print(f'Terengganu replacement count: {count}')
          path.write_text(text, encoding='utf-8')

      - name: Commit website update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add Terengganu Perhentian Beach tour package"
          git push
