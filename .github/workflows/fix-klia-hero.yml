name: Fix KLIA Hero

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace hero with KLIA Malaysia Airlines aircraft photo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'https://www.malaysiaairlines.com/content/dam/mh/my/en/experience/our-fleet/v2/a330neo/750x562_MastheadBanner-fleet-330neo.jpg'
          new = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Malaysia_Airlines_Airbus_A330-323_(35386426481).jpg?width=2200&v=3'
          s = s.replace(old, new)
          s = s.replace('from-slate-950/45 via-slate-950/15 to-transparent', 'from-slate-950/65 via-slate-950/30 to-slate-950/5')
          p.write_text(s)
          PY

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet || git commit -m 'Update hero to KLIA Malaysia Airlines aircraft'
          git push
