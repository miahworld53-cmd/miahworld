name: Fix KLIA Hero

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace hero image and clean overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'https://asset.kompas.com/crops/WM5UkD8D2Z_Io5HY6RvX9olcyR7I%3D/41x0%3A991x633/750x500/data/photo/2023/08/13/64d8fba934556.jpg'
          new = 'https://media.triple.guide/triple-cms/c_limit%2Cf_auto%2Ch_1024%2Cw_1024/f806fc36-44cb-4f27-a4a2-4d93e44b042e.jpeg'
          s = s.replace(old, new)
          s = s.replace('from-slate-950/35 via-slate-950/10 to-transparent', 'from-slate-950/20 via-slate-950/5 to-transparent')
          p.write_text(s)
          PY

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet || git commit -m 'Use clean KLIA Terminal 1 hero image'
          git push