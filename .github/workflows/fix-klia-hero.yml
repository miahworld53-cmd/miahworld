name: Fix KLIA Hero

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Malaysia Airlines flying hero image
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'https://media.triple.guide/triple-cms/c_limit%2Cf_auto%2Ch_1024%2Cw_1024/f806fc36-44cb-4f27-a4a2-4d93e44b042e.jpeg'
          new = 'https://www.malaysiaairlines.com/content/dam/mh/my/en/experience/our-fleet/v2/a330neo/750x562_MastheadBanner-fleet-330neo.jpg'
          s = s.replace(old, new)
          s = s.replace('bg-center" style={{ backgroundImage:', 'bg-center bg-[center_38%]" style={{ backgroundImage:')
          s = s.replace('from-slate-950/20 via-slate-950/5 to-transparent', 'from-slate-950/45 via-slate-950/15 to-transparent')
          p.write_text(s)
          PY

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet || git commit -m 'Use Malaysia Airlines flying hero image'
          git push
